name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Read the release version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set the version from the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/set-version.sh "$VERSION"
          grep -qxF "version = \"$VERSION\"" Cargo.toml || {
            echo "::error::Cargo.toml does not carry $VERSION after the rewrite"
            exit 1
          }

      - name: Check the formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Look the version up on crates.io
        id: registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -H 'User-Agent: knownbots-release' "https://crates.io/api/v1/crates/knownbots/$VERSION" || true)
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Report the published version
        if: steps.registry.outputs.status == '200'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "knownbots $VERSION is already published on crates.io, skipping the upload"

      - name: Publish to crates.io
        if: steps.registry.outputs.status != '200'
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
