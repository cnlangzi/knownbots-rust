# The User-Agent every vendor publishes for a crawler of the registry, and the
# page of the vendor that publishes it.
#
# The marker of a definition has to be a word of every User-Agent listed here,
# and every User-Agent listed here has to be attributed to the crawler that
# publishes it. `tests/markers.rs` holds the registry to that table.
#
# A vendor that publishes no User-Agent header but names its crawler — the
# token it writes in `robots.txt`, the identifier it gives the crawler —
# publishes that token as the User-Agent of the crawler, and the token is
# what the table lists. A token the crawler does not send is no User-Agent at
# all, and the definition of such a crawler is removed, as `google-extended`
# and `applebot-extended` were.
#
# The vendors that publish no User-Agent of their crawler at all keep their
# entry — the page that published it is cited — and are named here because the
# guard cannot hold them to it: `bytespider`, `redditbot`, `telegrambot` and
# `twitterbot`.
#
# The table is a snapshot of the documentation of the vendors: it reaches no
# network. A vendor that renames its token is noticed by the provider-health
# workflow, not by the guard.
